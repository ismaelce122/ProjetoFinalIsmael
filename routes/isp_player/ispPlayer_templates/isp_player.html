<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISP PLAYER</title>
    <link rel="shortcut icon" href="{{url_for('static',
    filename='image/icone/iconeIsp_player.png')}}" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="{{url_for('static',
    filename='css_bootstrap/bootstrap.min.css')}}">
    <link rel="stylesheet" href="{{url_for('ispPlayer.static',
    filename='css/isp_player.css')}}">
</head>

<body>
    <div class="overlay" id="box1">
        <div class="w-100">
            <div class="loader"></div>
            <div class="info">
                <h5 id="conteudo"></h5>
            </div>
        </div>
    </div>
    <div class="container-fluid logo">
        <div class="background"></div>
        <div class="titulo">
            <h2 class="texto_titulo">ISP PLAYER</h2>
            <div id="hora"></div>
        </div>
    </div>
    <div class="container d-none">
        <label>Servidor:</label><br>
        <input id="server" value="https://dnsturbo.sbs">
        <label>Usuário:</label><br>
        <input id="user" value="31363361">
        <label>Senha:</label><br>
        <input id="pass" type="password" value="31368332">
    </div>
    <div class="container mt-1">
        <div class="d-flex">
            <button onclick="mostrarCategoria()" autofocus>Canais</button>
            <button onclick="mostrarCategoriaSeries()" tabindex="0">Séries</button>
            <button onclick="mostrarCategoriaFilmes()" tabindex="0">Filmes</button>
        </div>
    </div>
    <div class="container-fluid box mt-3" id="box_pai">
        <div class="box_lista" id="lista"></div>
        <div class="w-100" id="box_player">
            <video id="player" controls></video>
            <p id="assistindo"></p>
            <div>
                <h6 id="titulo_programacao"></h6>
                <div class="box_programacao">
                    <div id="programacao"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{url_for('static',
    filename='js_bootstrap/bootstrap.bundle.min.js')}}"></script>
    <script src="{{url_for('ispPlayer.static',
    filename='js/isp_player.js')}}"></script>
</body>

</html>
